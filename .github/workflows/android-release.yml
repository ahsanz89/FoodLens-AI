name: Android release (EAS)
# Manual trigger: Actions → "Android release (EAS)" → Run workflow.
# One-time secrets (Settings → Secrets → Actions):
#   EXPO_TOKEN                 token from expo.dev → Account → Access tokens
#   PLAY_SERVICE_ACCOUNT_JSON  full JSON of a Google Play service account (see docs/PLAY_STORE_RELEASE.md)
on:
  workflow_dispatch:
    inputs:
      submit:
        description: Upload the build to Google Play (internal track, draft)
        type: boolean
        default: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck && npm test
      - uses: expo/expo-github-action@v8
        with: { eas-version: latest, token: "${{ secrets.EXPO_TOKEN }}" }
      - name: Write Play service account
        if: ${{ inputs.submit }}
        run: echo '${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}' > play-service-account.json
      - name: Build AAB
        run: eas build --platform android --profile production --non-interactive --wait
      - name: Submit to Google Play
        if: ${{ inputs.submit }}
        run: eas submit --platform android --profile production --latest --non-interactive
